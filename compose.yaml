services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=financialhub'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
    ports:
      - '5432:5432'

  rabbitmq:
    image: 'rabbitmq:3-management'
    ports:
      - '5672:5672'    # AMQP protocol
      - '15672:15672'  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  financial-summary-worker:
    # TODO: replace with GitHub URL when deploying without sibling repo
    # https://github.com/emiisomoza/financial-summary-worker
    build: ../financial-summary-worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - DB_PATH=/app/data/summaries.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - summary_data:/app/data

volumes:
  summary_data: