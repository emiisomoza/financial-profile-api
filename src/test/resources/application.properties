# Disable Docker Compose auto-start during tests (TestContainers handles its own containers)
spring.docker.compose.enabled=false

# Ensure schema.sql runs against external (TestContainers) datasources
spring.sql.init.mode=always

# JWT (test value — not used in production)
jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-32-chars!
jwt.expiration-hours=1
